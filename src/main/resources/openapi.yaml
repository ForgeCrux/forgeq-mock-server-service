openapi: 3.0.3
info:
  description: API for managing mock servers and simulating API responses based on
    collections
  title: ForgeQ Mock Server Service
  version: 1.0.0
servers:
- description: Local server
  url: http://localhost:8080
paths:
  /workspaces/{workspaceId}/mocks:
    get:
      parameters:
      - explode: false
        in: path
        name: workspaceId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MockResponse"
                type: array
          description: List of mock servers
      summary: Get all mock servers in a workspace
      tags:
      - MockServers
      x-accepts: application/json
      x-tags:
      - tag: MockServers
    post:
      parameters:
      - explode: false
        in: path
        name: workspaceId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMockRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockResponse"
          description: Mock server created successfully
      summary: Create a mock server inside a workspace
      tags:
      - MockServers
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: MockServers
  /mocks/{mockId}:
    delete:
      parameters:
      - explode: false
        in: path
        name: mockId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Mock server deleted successfully
      summary: Delete mock server
      tags:
      - MockServers
      x-accepts: application/json
      x-tags:
      - tag: MockServers
    get:
      parameters:
      - explode: false
        in: path
        name: mockId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockResponse"
          description: Mock server details
      summary: Get mock server by ID
      tags:
      - MockServers
      x-accepts: application/json
      x-tags:
      - tag: MockServers
    put:
      parameters:
      - explode: false
        in: path
        name: mockId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMockRequest"
        required: true
      responses:
        "200":
          description: Mock server updated successfully
      summary: Update mock server configuration
      tags:
      - MockServers
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: MockServers
  /mocks/{mockId}/toggle:
    patch:
      parameters:
      - explode: false
        in: path
        name: mockId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: Mock server state updated successfully
      summary: Enable or disable mock server (private/public control)
      tags:
      - MockServers
      x-accepts: application/json
      x-tags:
      - tag: MockServers
  /mock/{mockUrl}/{path}:
    delete:
      parameters:
      - explode: false
        in: path
        name: mockUrl
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Mocked response returned
      summary: Handle incoming DELETE request to mock server
      tags:
      - MockRuntime
      x-accepts: application/json
      x-tags:
      - tag: MockRuntime
    get:
      parameters:
      - explode: false
        in: path
        name: mockUrl
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Mocked response returned
      summary: Handle incoming GET request to mock server
      tags:
      - MockRuntime
      x-accepts: application/json
      x-tags:
      - tag: MockRuntime
    post:
      parameters:
      - explode: false
        in: path
        name: mockUrl
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Mocked response returned
      summary: Handle incoming POST request to mock server
      tags:
      - MockRuntime
      x-accepts: application/json
      x-tags:
      - tag: MockRuntime
    put:
      parameters:
      - explode: false
        in: path
        name: mockUrl
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: path
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Mocked response returned
      summary: Handle incoming PUT request to mock server
      tags:
      - MockRuntime
      x-accepts: application/json
      x-tags:
      - tag: MockRuntime
components:
  parameters:
    WorkspaceId:
      explode: false
      in: path
      name: workspaceId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    MockId:
      explode: false
      in: path
      name: mockId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  schemas:
    CreateMockRequest:
      example:
        delayMs: 0
        name: name
        isPrivate: true
        collectionId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        name:
          type: string
        collectionId:
          format: uuid
          type: string
        isPrivate:
          type: boolean
        delayMs:
          type: integer
      required:
      - collectionId
      - name
      type: object
    UpdateMockRequest:
      example:
        delayMs: 0
        name: name
        isPrivate: true
      properties:
        name:
          type: string
        isPrivate:
          type: boolean
        delayMs:
          type: integer
      type: object
    MockResponse:
      example:
        delayMs: 0
        requestCount: 6
        createdAt: 2000-01-23T04:56:07.000+00:00
        mockUrl: mockUrl
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        isPrivate: true
        collectionId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        workspaceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: uuid
          type: string
        workspaceId:
          format: uuid
          type: string
        collectionId:
          format: uuid
          type: string
        name:
          type: string
        mockUrl:
          type: string
        isPrivate:
          type: boolean
        delayMs:
          type: integer
        requestCount:
          type: integer
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
